name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary:
    name: Binary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev librsvg2-common xvfb xauth

      - name: Build
        run: make -j"$(nproc)"

      - name: Smoke test
        run: |
          xvfb-run -a ./linpaint --convert flatpak/org.linpaint.Paint.svg out.bmp bmp24
          test "$(head -c2 out.bmp)" = BM

      - name: Package
        run: |
          name="linpaint-${GITHUB_REF_NAME//\//-}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp linpaint linpaint.desktop README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz

  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # Builds flatpak/org.linpaint.Paint.yml and uploads the bundle as an artifact
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          manifest-path: flatpak/org.linpaint.Paint.yml
          bundle: linpaint-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.arch }}
          cache-key: flatpak-builder-${{ github.sha }}

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binary, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.flatpak
          generate_release_notes: true
