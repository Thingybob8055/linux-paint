<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7c1"/>
      <stop offset="1" stop-color="#ddc08a"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e35d4f"/>
      <stop offset="1" stop-color="#a5281f"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e949c"/>
      <stop offset=".45" stop-color="#eef0f2"/>
      <stop offset="1" stop-color="#7b818a"/>
    </linearGradient>
    <radialGradient id="gloss" cx=".35" cy=".3" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="62" cy="114" rx="46" ry="6" fill="#000" opacity=".18"/>

  <!-- palette with thumb hole -->
  <path fill="url(#wood)" stroke="#8a6630" stroke-width="3" stroke-linejoin="round" fill-rule="evenodd"
        d="M60 14C30 14 8 35 8 62c0 26 19 46 44 46 10 0 14-6 12-13-2-8 3-13 11-13h12c20 0 33-12 33-30C120 31 94 14 60 14z
           M26 76a8 8 0 1 0 16 0a8 8 0 1 0-16 0z"/>
  <path fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"
        d="M20 50C26 32 42 21 60 20"/>

  <!-- paint wells -->
  <g stroke="#000" stroke-opacity=".25" stroke-width="1.5">
    <circle cx="30" cy="50" r="9" fill="#ed1c24"/>
    <circle cx="50" cy="31" r="9" fill="#ffc90e"/>
    <circle cx="76" cy="28" r="9" fill="#22b14c"/>
    <circle cx="97" cy="42" r="9" fill="#00a2e8"/>
    <circle cx="58" cy="56" r="8" fill="#a349a4"/>
  </g>
  <g fill="url(#gloss)">
    <circle cx="30" cy="50" r="9"/>
    <circle cx="50" cy="31" r="9"/>
    <circle cx="76" cy="28" r="9"/>
    <circle cx="97" cy="42" r="9"/>
    <circle cx="58" cy="56" r="8"/>
  </g>

  <!-- brush -->
  <g transform="rotate(45 92 92)">
    <rect x="86" y="50" width="12" height="32" rx="6" fill="url(#handle)" stroke="#6e1a14" stroke-width="2"/>
    <rect x="89" y="54" width="3" height="22" rx="1.5" fill="#fff" opacity=".35"/>
    <rect x="85" y="80" width="14" height="14" rx="2" fill="url(#ferrule)" stroke="#5a6068" stroke-width="2"/>
    <path d="M85 94h14c0 10-3 18-7 24-4-6-7-14-7-24z" fill="#3f48cc" stroke="#232a80" stroke-width="2" stroke-linejoin="round"/>
    <path d="M89 96c0 6 1 11 3 15" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
